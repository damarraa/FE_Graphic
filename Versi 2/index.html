<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Operasional & Grafik</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">
        <header>
            <h1>📊 Dashboard Input Data</h1>
            <p>Input data harian per-part dan monitoring grafik real-time.</p>
        </header>

        <div id="setupPanel" class="card">
            <div class="card-header">
                <h3>⚙️ Konfigurasi Awal</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>Rentang Tanggal Operasional:</label>
                    <div class="date-range-group">
                        <input type="date" id="startDate" class="form-control">
                        <span class="separator">s/d</span>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Daftar Part / Item:</label>
                    <div class="input-group">
                        <input type="text" id="newPartInput" class="form-control"
                            placeholder="Nama Part (Contoh: Pompa A)..." onkeypress="handleEnter(event)">
                        <button onclick="addPart()" class="btn btn-primary">+ Tambah</button>
                    </div>
                    <ul id="partList" class="part-list">
                    </ul>
                </div>

                <hr>
                <button onclick="generateWorkspace()" class="btn btn-success btn-block">🚀 Generate Tabel &
                    Grafik</button>
            </div>
        </div>

        <div id="workspace" style="display: none;">

            <div class="toolbar">
                <div class="left">
                    <button onclick="backToSetup()" class="btn btn-secondary">⬅ Konfigurasi Ulang</button>
                </div>
                <div class="right">
                    <button onclick="resetData()" class="btn btn-danger">Reset</button>
                    <button onclick="saveData()" class="btn btn-save">💾 Simpan Data</button>
                </div>
            </div>

            <div class="card">
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr id="headerRow">
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card chart-card">
                <h3>📈 Grafik Monitoring</h3>
                <div class="chart-wrapper">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
